<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa820a" />
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0a1945" />
    </linearGradient>
    <path id="textArcTop" d="M 65 200 A 135 135 0 0 1 335 200" fill="none" />
    <path id="textArcBottom" d="M 335 200 A 135 135 0 0 1 65 200" fill="none" />
  </defs>

  <!-- Outer Gold Rim -->
  <circle cx="200" cy="200" r="195" fill="none" stroke="url(#goldGrad)" stroke-width="4" />
  <circle cx="200" cy="200" r="188" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4,3" />

  <!-- Main Blue Ring -->
  <circle cx="200" cy="200" r="185" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="3" />

  <!-- Inner Gold Rim -->
  <circle cx="200" cy="200" r="118" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" />
  <circle cx="200" cy="200" r="113" fill="url(#blueGrad)" stroke="url(#goldGrad)" stroke-width="1" />

  <!-- Circular Text -->
  <text fill="#ffe066" font-family="'Outfit', 'Georgia', serif" font-size="20" font-weight="800" letter-spacing="4">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">GREENWOOD CONVENT</textPath>
  </text>
  <text fill="#ffe066" font-family="'Outfit', 'Georgia', serif" font-size="15" font-weight="700" letter-spacing="3">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">• ESTD 1998 • DELHI •</textPath>
  </text>

  <!-- Stars on Ring -->
  <g fill="#ffd700">
    <path d="M 52 200 l 3 6 l 7 1 l -5 5 l 1 7 l -6 -3 l -6 3 l 1 -7 l -5 -5 l 7 -1 z" transform="scale(0.8) translate(15, 50)" />
    <path d="M 448 200 l 3 6 l 7 1 l -5 5 l 1 7 l -6 -3 l -6 3 l 1 -7 l -5 -5 l 7 -1 z" transform="scale(0.8) translate(-45, 50)" />
  </g>

  <!-- Center Emblem: Book, Torch of Knowledge & Laurels -->
  <!-- Sun Rays behind Torch -->
  <g stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6">
    <line x1="200" y1="145" x2="200" y2="125" />
    <line x1="185" y1="150" x2="170" y2="135" />
    <line x1="215" y1="150" x2="230" y2="135" />
    <line x1="175" y1="160" x2="155" y2="150" />
    <line x1="225" y1="160" x2="245" y2="150" />
  </g>

  <!-- Open Book -->
  <g fill="#ffffff" stroke="#d4af37" stroke-width="2" stroke-linejoin="round">
    <path d="M 200 235 C 185 220 150 220 135 224 L 135 258 C 150 254 185 254 200 268 Z" fill="#f8fafc" />
    <path d="M 200 235 C 215 220 250 220 265 224 L 265 258 C 250 254 215 254 200 268 Z" fill="#f8fafc" />
    <!-- Book Pages Lines -->
    <path d="M 145 234 Q 170 231 190 242 M 145 242 Q 170 239 190 250 M 145 250 Q 170 247 190 258" stroke="#cbd5e1" stroke-width="1.2" fill="none" />
    <path d="M 255 234 Q 230 231 210 242 M 255 242 Q 230 239 210 250 M 255 250 Q 230 247 210 258" stroke="#cbd5e1" stroke-width="1.2" fill="none" />
  </g>

  <!-- Torch of Wisdom -->
  <path d="M 195 210 L 205 210 L 202 245 L 198 245 Z" fill="url(#goldGrad)" stroke="#996515" stroke-width="1" />
  <ellipse cx="200" cy="208" rx="8" ry="4" fill="url(#goldGrad)" />
  <!-- Flame -->
  <path d="M 200 162 C 193 175 190 185 193 195 C 195 202 205 202 207 195 C 210 185 207 175 200 162 Z" fill="#f97316" />
  <path d="M 200 172 C 196 180 195 188 197 194 C 198 198 202 198 203 194 C 205 188 204 180 200 172 Z" fill="#fde047" />

  <!-- Laurel Wreath -->
  <g fill="none" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round">
    <path d="M 132 230 C 120 200 125 160 148 135" />
    <path d="M 268 230 C 280 200 275 160 252 135" />
  </g>
  <!-- Laurel Leaves -->
  <g fill="url(#goldGrad)">
    <ellipse cx="130" cy="215" rx="6" ry="3" transform="rotate(-30 130 215)" />
    <ellipse cx="126" cy="195" rx="6" ry="3" transform="rotate(-45 126 195)" />
    <ellipse cx="128" cy="175" rx="6" ry="3" transform="rotate(-60 128 175)" />
    <ellipse cx="136" cy="155" rx="6" ry="3" transform="rotate(-75 136 155)" />
    <ellipse cx="148" cy="140" rx="6" ry="3" transform="rotate(-90 148 140)" />

    <ellipse cx="270" cy="215" rx="6" ry="3" transform="rotate(30 270 215)" />
    <ellipse cx="274" cy="195" rx="6" ry="3" transform="rotate(45 274 195)" />
    <ellipse cx="272" cy="175" rx="6" ry="3" transform="rotate(60 272 175)" />
    <ellipse cx="264" cy="155" rx="6" ry="3" transform="rotate(75 264 155)" />
    <ellipse cx="252" cy="140" rx="6" ry="3" transform="rotate(90 252 140)" />
  </g>
</svg>